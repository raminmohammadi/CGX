# Default values for the CGX chart.

replicaCount: 1

image:
  repository: cgx
  tag: ""            # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

# Extra environment for the container. CGX_HOST/PORT/CONFIG_DIR are set by the
# deployment template; add governance/provider config here.
env:
  CGX_RETENTION_DAYS: "30"

# Persist config + observation DBs (SQLite) under CGX_CONFIG_DIR (/data).
persistence:
  enabled: true
  size: 2Gi
  storageClass: ""
  accessMode: ReadWriteOnce

service:
  type: ClusterIP
  port: 80
  targetPort: 8765

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: cgx.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Probe paths match the server's root-level Kubernetes-style endpoints.
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    path: /readyz
    initialDelaySeconds: 10
    periodSeconds: 15

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Emit a Prometheus Operator ServiceMonitor scraping /api/metrics.
serviceMonitor:
  enabled: false
  interval: 15s

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /api/metrics
  prometheus.io/port: "8765"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
